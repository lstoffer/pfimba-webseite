title: Jahresprogramm
extends: options/base_options

options:
  update:
    leiter: true
    stufenleiter: true
    social-media: true

columns:
  main:
    width: 2/3
    sections:
      header:
        type: fields
        fields:
          header: fields/header_content
      
      content:
        type: fields
        fields:
          inhalt:
            label: Inhalt
            type: headline
          aktivitaeten:
            type: blocks
            pretty: true
            fieldsets:
              - jahresprogramm_jahr
              - one_col
              - two_col
              - three_col
  
  sidebar:
    width: 1/3
    sections:
      pages:
        type: pages
        label: Unterseiten
      files:
        type: files

