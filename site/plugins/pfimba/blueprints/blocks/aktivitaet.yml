type: aktivitaet
title: Aktivität
label: "{{ titel }} ({{ datum }})"
preview: fields
wysiwyg: true
fields:
  titel:
    label: Titel
    type: text
    required: true

  datum:
    label: Datum
    type: date
    required: true

  stufen:
    label: Stufen
    type: multiselect
    min: 1
    options:
      abteilung: Abteilung
      biber: Biber
      woelfe: Wölfe
      pfadis: Pfadis
      pios: Pios
    required: true

  info:
    label: Zusatzinformation
    type: writer
    inline: true
    marks:
      - bold
    required: false

  besammlung:
    label: Besammlung
    type: writer
    inline: true
    marks:
      - bold
    required: true

  besammlungsort:
    label: Besammlungsort (Link)
    type: link
    required: false

  schluss:
    label: Schluss
    type: writer
    inline: true
    marks:
      - bold
    required: true

  schlussort:
    label: Schlussort (Link)
    type: link
    required: false

  mitnehmen:
    label: Mitnehmen
    type: writer
    inline: true
    marks:
      - bold
    required: true

  leitperson:
    label: Leitperson Name
    type: text
    required: true

  email_leitperson:
    label: Leitperson Email
    type: email
    required: true

  telefon_leitperson:
    label: Leitperson Telefon
    type: tel
    required: false
